<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #05070d;
    color: #00eaff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 600px;
    text-align: center;
}

h1 {
    font-size: 42px;
    margin-bottom: 5px;
    letter-spacing: 5px;
}

.status {
    color: #00ff88;
    margin-bottom: 20px;
}

.arc {
    width: 190px;
    height: 190px;
    margin: 20px auto;
    border: 3px solid #00eaff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 25px #00eaff;
}

.arc span {
    font-size: 45px;
}

button {
    background: transparent;
    color: #00eaff;
    border: 2px solid #00eaff;
    border-radius: 30px;
    padding: 14px 30px;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
}

button:hover {
    background: #00eaff;
    color: #05070d;
}

.chat {
    margin-top: 20px;
    padding: 15px;
    height: 250px;
    overflow-y: auto;
    border: 1px solid #16495a;
    border-radius: 15px;
    text-align: left;
    background: #080c14;
}

.message {
    margin: 12px 0;
    line-height: 1.5;
}

.user {
    color: #ffffff;
}

.jarvis {
    color: #00eaff;
}

.small {
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <h1>JARVIS</h1>

    <div class="status" id="status">
        🟢 JARVIS is online
    </div>

    <div class="arc">
        <span>🤖</span>
    </div>

    <button onclick="startListening()">
        🎙️ Speak
    </button>

    <button onclick="stopSpeaking()">
        🔇 Stop
    </button>

    <div class="chat" id="chat">
        <div class="message jarvis">
            <b>JARVIS:</b> Hello! I am ready.
        </div>
    </div>

    <p class="small">
        Voice AI Assistant
    </p>

</div>

<script>

/* =========================================
   JARVIS SETTINGS
========================================= */

const BACKEND_URL =
    "https://jarvis-ai-one-delta.vercel.app/api/chat";


/* =========================================
   UI
========================================= */

const statusText = document.getElementById("status");
const chat = document.getElementById("chat");


function addMessage(sender, message, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.innerHTML =
        "<b>" + sender + ":</b> " +
        message;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


/* =========================================
   VOICE OUTPUT
========================================= */

function speak(text) {

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-IN";
    speech.rate = 0.95;
    speech.pitch = 0.9;

    window.speechSynthesis.speak(speech);
}


function stopSpeaking() {

    window.speechSynthesis.cancel();

    statusText.innerText =
        "🟢 JARVIS is online";
}


/* =========================================
   VOICE RECOGNITION
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = function() {

        statusText.innerText =
            "🔵 Listening...";
    };


    recognition.onresult = function(event) {

        const command =
            event.results[0][0].transcript;

        addMessage(
            "You",
            command,
            "user"
        );

        processCommand(command);
    };


    recognition.onerror = function(event) {

        console.log(
            "Voice error:",
            event.error
        );

        statusText.innerText =
            "🔴 Voice error: " +
            event.error;
    };


    recognition.onend = function() {

        if (
            statusText.innerText ===
            "🔵 Listening..."
        ) {
            statusText.innerText =
                "🟢 JARVIS is online";
        }
    };

}


function startListening() {

    if (!recognition) {

        alert(
            "Voice recognition is not supported in this browser."
        );

        return;
    }

    try {

        recognition.start();

    } catch (error) {

        console.log(error);
    }
}


/* =========================================
   COMMAND PROCESSING
========================================= */

function processCommand(command) {

    const text =
        command.toLowerCase().trim();


    /* GREETING */

    if (
        text.includes("hello") ||
        text.includes("hi jarvis") ||
        text === "hi"
    ) {

        const reply =
            "Hello! How can I help you?";

        addMessage(
            "JARVIS",
            reply,
            "jarvis"
        );

        speak(reply);

        return;
    }


    /* TIME */

    if (text.includes("time")) {

        const time =
            new Date().toLocaleTimeString(
                "en-IN",
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            );

        const reply =
            "The current time is " + time;

        addMessage(
            "JARVIS",
            reply,
            "jarvis"
        );

        speak(reply);

        return;
    }


    /* DATE */

    if (text.includes("date")) {

        const date =
            new Date().toLocaleDateString(
                "en-IN",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

        const reply =
            "Today's date is " + date;

        addMessage(
            "JARVIS",
            reply,
            "jarvis"
        );

        speak(reply);

        return;
    }


    /* YOUTUBE */

    if (text.includes("youtube")) {

        const reply =
            "Opening YouTube.";

        addMessage(
            "JARVIS",
            reply,
            "jarvis"
        );

        speak(reply);

        setTimeout(function() {

            window.open(
                "https://www.youtube.com/",
                "_blank"
            );

        }, 1000);

        return;
    }


    /* GOOGLE */

    if (
        text === "google" ||
        text.includes("open google")
    ) {

        const reply =
            "Opening Google.";

        addMessage(
            "JARVIS",
            reply,
            "jarvis"
        );

        speak(reply);

        setTimeout(function() {

            window.open(
                "https://www.google.com/",
                "_blank"
            );

        }, 1000);

        return;
    }


    /* INSTAGRAM */

    if (text.includes("instagram")) {

        const reply =
            "Opening Instagram.";

        addMessage(
            "JARVIS",
            reply,
            "jarvis"
        );

        speak(reply);

        setTimeout(function() {

            window.open(
                "https://www.instagram.com/",
                "_blank"
            );

        }, 1000);

        return;
    }


    /* SEARCH */

    if (text.startsWith("search ")) {

        const search =
            text.replace("search ", "");

        const reply =
            "Searching Google for " +
            search;

        addMessage(
            "JARVIS",
            reply,
            "jarvis"
        );

        speak(reply);

        setTimeout(function() {

            window.open(
                "https://www.google.com/search?q=" +
                encodeURIComponent(search),
                "_blank"
            );

        }, 1000);

        return;
    }


    /* STOP */

    if (
        text === "stop" ||
        text.includes("stop speaking")
    ) {

        stopSpeaking();

        return;
    }


    /* AI */

    askAI(command);
}


/* =========================================
   AI BACKEND
========================================= */

async function askAI(question) {

    statusText.innerText =
        "🧠 JARVIS is thinking...";

    addMessage(
        "JARVIS",
        "Thinking...",
        "jarvis"
    );


    try {

        const response =
            await fetch(
                BACKEND_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: question
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Backend returned " +
                response.status
            );
        }


        const data =
            await response.json();


        const reply =
            data.reply ||
            "I could not understand the AI response.";


        /* Remove Thinking message */

        const messages =
            chat.querySelectorAll(
                ".message"
            );

        if (messages.length > 0) {

            const last =
                messages[messages.length - 1];

            if (
                last.innerText.includes(
                    "Thinking..."
                )
            ) {
                last.remove();
            }
        }


        addMessage(
            "JARVIS",
            reply,
            "jarvis"
        );


        speak(reply);


        statusText.innerText =
            "🟢 JARVIS is online";


    } catch (error) {

        console.error(
            "AI Error:",
            error
        );


        const messages =
            chat.querySelectorAll(
                ".message"
            );

        if (messages.length > 0) {

            const last =
                messages[messages.length - 1];

            if (
                last.innerText.includes(
                    "Thinking..."
                )
            ) {
                last.remove();
            }
        }


        const reply =
            "I cannot connect to my AI brain right now. Please check the Vercel backend.";

        addMessage(
            "JARVIS",
            reply,
            "jarvis"
        );

        speak(reply);


        statusText.innerText =
            "🔴 AI connection error";
    }
}

</script>

</body>
</html>
